<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/img/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto | Serenity Estética</title>
    <link rel="stylesheet" href="styles/contacto.css" />
  </head>
  <body>
    <header>
      <nav class="header-nav">
        <div class="brand-container">
          <img
            src="img/logo.png"
            alt="Logo de Serenity Estética"
            class="header-logo"
          />
          <h1 class="header-title">Serenity Estética</h1>
        </div>
        <div class="hamburger" id="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <ul class="nav-menu">
          <li><a class="nav-link" href="/">Inicio</a></li>
          <li>
            <a class="nav-link" href="sobrenosotros.html">Sobre Nosotros</a>
          </li>
          <li><a class="nav-link" href="servicios.html">Servicios</a></li>
          <li><a class="nav-link" href="productos.html">Productos</a></li>
          <li><a class="nav-link" href="contacto.html">Contacto</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="main-container">
        <h2 class="form-title">Ponte en contacto con nosotras</h2>
        <p class="form-desc">
          Déjanos tu mensaje y nos pondremos en contacto lo antes posible para
          ayudarte a brillar
        </p>

        <form class="contact-form">
          <div class="form-group">
            <label for="nombre">Nombre completo</label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              placeholder="Tu nombre"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="tuemail@ejemplo.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="telefono">Teléfono</label>
            <input
              type="tel"
              id="telefono"
              name="telefono"
              placeholder="Ej: 3001234567"
            />
          </div>

          <div class="form-group">
            <label for="mensaje">Mensaje</label>
            <textarea
              id="mensaje"
              name="mensaje"
              rows="5"
              placeholder="Escribe tu mensaje aquí..."
              required
            ></textarea>
          </div>

          <button type="submit" class="btn-submit">Enviar mensaje</button>
        </form>
      </div>
    </main>

    <footer>
      <h3>Contáctanos</h3>
      <nav>
        <ul class="contact-list">
          <li class="contact-item">
            <a href="https://www.instagram.com/serenity_estetica1/">
              <img
                src="/img/instagram.png"
                alt="Logo Instagram"
                class="logo-footer"
              />
              Instagram
            </a>
          </li>
          <li class="contact-item">
            <a href="https://api.whatsapp.com/message/VR5KJGAXEIHAG1">
              <img
                src="/img/whatsapp.png"
                alt="Logo WhatsApp"
                class="logo-footer"
              />
              Whatsapp
            </a>
          </li>
          <li class="contact-item">
            <a href="https://maps.app.goo.gl/rD8DxrsuFYjxtmLP7">
              <img
                src="/img/location.png"
                alt="Logo de ubicación"
                class="logo-footer"
              />
              Cl. 42 #60A-05
            </a>
          </li>
        </ul>
      </nav>
    </footer>
    <script src="js/burger.js"></script>
  </body>
</html>
